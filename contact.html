<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- META TAGS -->
    <meta name="description" content="Contact Sweet Food Stories to share your recipes, stories, or questions.">
    <meta name="keywords" content="contact, recipes, messages, sweet food">

    <title>Contact – Sweet Food Stories</title>

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="logo.png" alt="Sweet Food Stories Logo" class="site-logo">
        <h1>Contact</h1>
        <p>We’d love to hear from you.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="recipes.html">Recipes</a></li>
            <li><a href="stories.html">Stories</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>

        <section class="contact-intro">
            <h2>Get in Touch</h2>
            <p>Have a recipe to share or a story to tell? Reach out anytime!</p>

            <!-- IMAGE RESTORED -->
            <img src="souffle.jpg" alt="Souffle Dessert" class="contact-image">
        </section>

        <section class="contact-form">
            <h2>Send a Message</h2>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your email">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Write your message here"></textarea>

                <label for="dessert">Favorite Dessert</label>
                <input type="text" id="dessert" placeholder="Your favorite dessert">

                <button class="btn" type="submit">Send</button>

            </form>
        </section>

    </main>

    <footer>
        <p style="text-align: center;">Copyright © 2026 Sweet Food Stories</p>
        <p style="text-align: center; font-style: italic;">
            Mario Vargas – <a href="mailto:mariovargas@asu.edu">mariovargas@asu.edu</a>
        </p>
    </footer>

</body>
</html>
